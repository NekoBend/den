name: dev image

# docker/ubuntu/Dockerfile compiles the Rust tools and runs every installer,
# so CI builds it only when the image or this workflow changes, or on demand.
# The build checks that the Dockerfile still works; the step after it checks
# the HOME and PATH root gets with and without a shell, and runs dev's forms
# from docker/README.md. The remaining steps check a state volume with its
# backup and restore, a build at a commit of den, and an image FROM denbox with
# its drop-ins.
on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/docker-dev-image.yml"
  pull_request:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/docker-dev-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-image:
    name: dev image (build + HOME/PATH checks)
    runs-on: ubuntu-latest
    # The sum of the step budgets below plus a few minutes for the rest.
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A cold build keeps every layer, the Rust tools' cargo target cache and
      # the image that load hands to the Docker daemon on the runner's disk,
      # much of which preinstalled SDKs this job does not use take up.
      - name: Free disk space
        timeout-minutes: 10
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # A cold build compiles every Rust tool; with the layers cached, a rerun
      # redoes only what changed (and den's stage when den's main has moved).
      # The base image is pinned by digest, so a new base, which makes the
      # next run cold, comes only with a change to BASE_IMAGE.
      # A build cut off before it ends exports no cache, so the budget is for
      # a cold build. The scope keeps this cache apart from the shell test
      # image's in ci.yml, which uses the default scope: two images in one
      # scope overwrite each other's cache. A failed cache export does not
      # fail the job, so the checks still run.
      - name: Build the dev image
        timeout-minutes: 150
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/ubuntu
          file: docker/ubuntu/Dockerfile
          tags: denbox
          load: true
          cache-from: type=gha,scope=den-dev-image
          cache-to: type=gha,mode=max,scope=den-dev-image,ignore-error=true
      - name: Check HOME and PATH for root and dev
        timeout-minutes: 10
        run: |
          # The commands in single quotes run in the container's shells.
          # shellcheck disable=SC2016
          docker image ls denbox
          # Start the container as docker/README.md does: the entrypoint drops
          # to dev and runs the default command, zsh, as PID 1.
          docker run -dit --name denbox denbox
          for _ in $(seq 30); do
            [ "$(docker exec denbox cat /proc/1/comm)" = zsh ] && break
            sleep 1
          done
          system_path=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          failed=0
          # check LABEL PATTERN COMMAND...: COMMAND exits 0 and the last line
          # of its output matches the glob PATTERN.
          check() {
            local label=$1 pattern=$2 out got status=0
            shift 2
            out=$("$@" 2>"$RUNNER_TEMP/check.err") || status=$?
            got=$(printf '%s\n' "$out" | tail -n 1)
            got=${got%"${got##*[![:space:]]}"}
            # shellcheck disable=SC2053 # PATTERN is a glob on purpose
            if [ "$status" -eq 0 ] && [[ $got == $pattern ]]; then
              echo "ok    $label: $got"
            else
              echo "::error::$label: exit status $status, got '$got', want '$pattern'"
              printf '%s\n' "$out"
              cat "$RUNNER_TEMP/check.err"
              failed=$((failed + 1))
            fi
          }

          # The loop above waits for the entrypoint's command; fail if it never came.
          check 'docker run -dit: PID 1 command' zsh docker exec denbox cat /proc/1/comm

          # root, with or without a shell: root's home, system directories only.
          check 'root exec: id -u' 0 docker exec denbox id -u
          check 'root exec: HOME' /root docker exec denbox printenv HOME
          check 'root exec: PATH' "$system_path" docker exec denbox printenv PATH
          check 'root exec: python3 user site-packages' '/root/*' \
            docker exec denbox python3 -c 'import site; print(site.getusersitepackages())'
          check 'root sh -c: HOME' /root docker exec denbox sh -c 'echo "$HOME"'
          check 'root bash -c: HOME' /root docker exec denbox bash -c 'echo "$HOME"'
          check 'root zsh -lc: HOME' /root docker exec denbox zsh -lc 'print -r -- "$HOME"'
          check 'root zsh -lc: PATH' "$system_path" \
            docker exec denbox zsh -lc 'print -r -- "$PATH"'
          check 'root bash -lc: PATH' "$system_path" \
            docker exec denbox bash -lc 'echo "$PATH"'

          # dev: its shells give it its home and tool directories back.
          check 'dev zsh -lc: HOME' /home/dev \
            docker exec --user dev denbox zsh -lc 'print -r -- "$HOME"'
          check 'dev zsh -ic: HOME' /home/dev \
            docker exec --user dev denbox zsh -ic 'print -r -- "$HOME"'
          for tool in den uv starship rg; do
            check "dev zsh -lc: $tool runs from /home/dev" '/home/dev/*' \
              docker exec --user dev denbox zsh -lc "$tool --version >/dev/null && whence -p $tool"
          done
          # fzf comes from its release into dev's ~/.local/bin; PowerShell
          # from its release as a package for root and dev.
          check 'dev zsh -lc: fzf --version' '/home/dev/*' \
            docker exec --user dev denbox zsh -lc 'fzf --version >/dev/null && whence -p fzf'
          check 'root exec: pwsh --version' 'PowerShell *' docker exec denbox pwsh --version
          check 'dev zsh -lc: pwsh --version' 'PowerShell *' \
            docker exec --user dev denbox zsh -lc 'pwsh --version'
          check 'dev bash -ic: HOME' /home/dev \
            docker exec --user dev denbox bash -ic 'echo "$HOME"'
          check 'dev bash -ic: HISTFILE' /home/dev/.bash_history \
            docker exec --user dev denbox bash -ic 'echo "$HISTFILE"'
          check 'dev bash -lc: HOME' /home/dev \
            docker exec --user dev denbox bash -lc 'echo "$HOME"'
          check 'dev sh -lc: HOME' /home/dev \
            docker exec --user dev denbox sh -lc 'echo "$HOME"'
          # Without a shell, dev keeps the image's HOME; docker/README.md says
          # to pass HOME and the full path.
          check 'dev exec: HOME' /root docker exec --user dev denbox printenv HOME
          check 'dev exec -e HOME: den --version' 'den ?*' \
            docker exec --user dev -e HOME=/home/dev denbox /home/dev/.local/bin/den --version

          # The entrypoint runs its default command, and any other, as dev with
          # dev's home and tool directories.
          check 'docker run -dit: PID 1 user' dev docker exec denbox ps -o user= -p 1
          check 'docker run: default command (zsh)' 'dev /home/dev' \
            docker run --rm -i denbox <<<'print -r -- "$(id -un) $HOME"'
          check 'docker run: HOME' /home/dev docker run --rm denbox printenv HOME
          expected_path=/home/dev/.nvm/current/bin:/home/dev/.local/bin:/home/dev/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          check 'docker run: PATH' "$expected_path" docker run --rm denbox printenv PATH

          if [ "$failed" -ne 0 ]; then
            docker logs denbox
            echo "::error::$failed check(s) failed"
            exit 1
          fi
      # docker/README.md's "What survives where": a root start with a volume
      # at /state links dev's listed paths into it, zsh rewrites its history
      # through the link, a new container on the same volume finds it there,
      # a bound host directory stays on the host, and DENBOX_STATE=0 links
      # nothing.
      - name: Check the state volume
        timeout-minutes: 10
        run: |
          # The commands in single quotes run in the container's shells.
          # shellcheck disable=SC2016
          failed=0
          # check LABEL COMMAND...: COMMAND exits 0 and prints no warning of
          # the entrypoint or of state-link.
          check() {
            local label=$1 status=0
            shift
            "$@" >"$RUNNER_TEMP/state.out" 2>&1 || status=$?
            if [ "$status" -eq 0 ] \
              && ! grep -Eq '^(container-entrypoint|state-link):' "$RUNNER_TEMP/state.out"; then
              echo "ok    $label"
            else
              echo "::error::$label: exit status $status"
              cat "$RUNNER_TEMP/state.out"
              failed=$((failed + 1))
            fi
          }
          # The image's list, /etc/denbox/state-paths.d/denbox.list.
          paths='.ssh .gitconfig .zsh_history .bash_history .config/gh .config/rclone .local/share/zoxide .local/share/powershell/PSReadLine .config/den .config/denbox .vscode-server'
          linked='for p in '"$paths"'; do
            t=$(readlink "/home/dev/$p") && [ "$t" = "/state/home/$p" ] \
              || { echo "/home/dev/$p: ${t:-not a link}"; exit 1; }
          done'
          unlinked='for p in '"$paths"'; do
            if [ -L "/home/dev/$p" ]; then echo "/home/dev/$p is a link"; exit 1; fi
          done'
          docker volume create denbox-state
          docker run -d --init --name denbox-state -v denbox-state:/state denbox sleep infinity
          for _ in $(seq 30); do
            docker exec denbox-state pgrep -x sleep >/dev/null && break
            sleep 1
          done
          check 'first start: the entrypoint printed no warning' docker logs denbox-state
          check 'first start: the listed paths link into /state/home' \
            docker exec --user dev denbox-state sh -c "$linked"
          # fc -W rewrites the history file, as zsh does when it trims it.
          # Without no_hist_save_by_copy for dev, the rewrite replaces the link
          # with a file of the container's layer; a save at exit only appends.
          printf '%s\n' 'echo denbox-state-probe' 'fc -W' exit \
            | docker exec -i --user dev denbox-state zsh -i >/dev/null 2>&1 || true
          check 'zsh -i, fc -W: ~/.zsh_history is still a link' \
            docker exec --user dev denbox-state sh -c '[ -L /home/dev/.zsh_history ]'
          check 'zsh -i, fc -W: the history is in the volume' \
            docker exec --user dev denbox-state grep -q denbox-state-probe /state/home/.zsh_history
          docker rm -f denbox-state
          check 'new container on the volume: linked again, with the history' \
            docker run --rm -v denbox-state:/state denbox \
              sh -c "$linked"' && grep -q denbox-state-probe /home/dev/.zsh_history'
          # A host directory bound over a listed path stays on the host: the
          # entry is skipped with a warning. The directory is dev's (1000), so
          # only that rule keeps state-link from moving its file into the
          # volume, which deletes it on the host.
          mkdir "$RUNNER_TEMP/ssh"
          docker run --rm -v "$RUNNER_TEMP/ssh:/x" --entrypoint sh denbox \
            -c 'echo key > /x/id_test && chown -R 1000:1000 /x'
          docker run --rm -v denbox-state:/state -v "$RUNNER_TEMP/ssh:/home/dev/.ssh" \
            denbox true >"$RUNNER_TEMP/state.out" 2>&1 || true
          if grep -q '^state-link: .*: skipped \.ssh: mount point /home/dev/\.ssh is at' \
              "$RUNNER_TEMP/state.out" \
            && [ "$(grep -c '^state-link:' "$RUNNER_TEMP/state.out")" -eq 1 ] \
            && [ -f "$RUNNER_TEMP/ssh/id_test" ]; then
            echo "ok    bound ~/.ssh: skipped with a warning, and its file stays on the host"
          else
            echo "::error::bound ~/.ssh: not skipped, or its file left the host"
            cat "$RUNNER_TEMP/state.out"
            ls -la "$RUNNER_TEMP/ssh"
            failed=$((failed + 1))
          fi
          check 'DENBOX_STATE=0: nothing linked' \
            docker run --rm -e DENBOX_STATE=0 -v denbox-state:/state denbox sh -c "$unlinked"
          # The README's backup and restore. dev is 1000 here, and the runner's
          # user is not, so the backup reads as dev and writes to an open folder.
          mkdir -m 0777 "$RUNNER_TEMP/backups"
          docker run --rm --user 1000:1000 \
            -v denbox-state:/state:ro -v "$RUNNER_TEMP/backups:/backup" \
            --entrypoint sh denbox -c 'umask 077 && tar -czf /backup/denbox-state.tgz -C /state .'
          docker volume create denbox-state-restored
          docker run --rm -v denbox-state-restored:/state -v "$RUNNER_TEMP/backups:/backup:ro" \
            --entrypoint tar denbox -xzpf /backup/denbox-state.tgz -C /state --numeric-owner
          check 'restored volume: linked again, with the history' \
            docker run --rm -v denbox-state-restored:/state denbox \
              sh -c "$linked"' && grep -q denbox-state-probe /home/dev/.zsh_history'
          docker volume rm denbox-state denbox-state-restored
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed check(s) failed"
            exit 1
          fi
      # docker/README.md's Run table: HOST_UID/HOST_GID other than the build's
      # give dev those IDs and re-own its home; FIX_WORKSPACE_OWNERSHIP=1 also
      # re-owns what in /workspace had the old IDs, leaving other owners and
      # each mount point below it alone; DENBOX_CLEAN_TMP=1 empties a /tmp
      # volume at the start, and without it the volume is kept.
      - name: Check ID remapping and /tmp cleanup
        timeout-minutes: 10
        run: |
          # The commands in single quotes run in the container's shells.
          # shellcheck disable=SC2016
          failed=0
          # check LABEL COMMAND...: COMMAND exits 0 and prints no warning of
          # the entrypoint or of state-link.
          check() {
            local label=$1 status=0
            shift
            "$@" >"$RUNNER_TEMP/remap.out" 2>&1 || status=$?
            if [ "$status" -eq 0 ] \
              && ! grep -Eq '^(container-entrypoint|state-link):' "$RUNNER_TEMP/remap.out"; then
              echo "ok    $label"
            else
              echo "::error::$label: exit status $status"
              cat "$RUNNER_TEMP/remap.out"
              failed=$((failed + 1))
            fi
          }
          # A bound workspace with a file of the image's dev (1000), one of
          # another owner, and a second bind below it with a file of dev's.
          mkdir "$RUNNER_TEMP/ws" "$RUNNER_TEMP/ws-nested"
          docker run --rm -v "$RUNNER_TEMP/ws:/x" -v "$RUNNER_TEMP/ws-nested:/y" --entrypoint sh denbox \
            -c 'touch /x/mine /x/theirs /y/nested && chown 1000:1000 /x/mine /y/nested && chown 2000:2000 /x/theirs'
          # dev gets the new IDs, its home and the file of the old IDs in
          # /workspace follow, the other owner's file and the nested bind do
          # not, and dev can still write its home and run den.
          status=0
          docker run --rm -e HOST_UID=1234 -e HOST_GID=1234 -e FIX_WORKSPACE_OWNERSHIP=1 \
            -v "$RUNNER_TEMP/ws:/workspace" -v "$RUNNER_TEMP/ws-nested:/workspace/nested" \
            denbox sh -ec '
              [ "$(id -u):$(id -g)" = 1234:1234 ]
              [ "$(stat -c %u:%g /home/dev)" = 1234:1234 ]
              [ "$(stat -c %u:%g /home/dev/.zshrc)" = 1234:1234 ]
              [ "$(stat -c %u:%g /home/dev/.local/bin/den)" = 1234:1234 ]
              [ "$(stat -c %u:%g /workspace/mine)" = 1234:1234 ]
              [ "$(stat -c %u:%g /workspace/theirs)" = 2000:2000 ]
              [ "$(stat -c %u:%g /workspace/nested/nested)" = 1000:1000 ]
              touch /home/dev/.cache/remap-probe
              zsh -lc "den --version" >/dev/null
            ' >"$RUNNER_TEMP/remap.out" 2>&1 || status=$?
          if [ "$status" -eq 0 ] \
            && grep -q '^container-entrypoint: remapping dev from 1000:1000 to 1234:1234 ' "$RUNNER_TEMP/remap.out" \
            && grep -q '^container-entrypoint: re-owning /workspace from 1000:1000 leaves out each mount point below it and all it holds: /workspace/nested$' "$RUNNER_TEMP/remap.out" \
            && [ "$(grep -c '^container-entrypoint:' "$RUNNER_TEMP/remap.out")" -eq 2 ] \
            && ! grep -q '^state-link:' "$RUNNER_TEMP/remap.out"; then
            echo "ok    HOST_UID/HOST_GID=1234 with FIX_WORKSPACE_OWNERSHIP=1"
          else
            echo "::error::HOST_UID/HOST_GID=1234 with FIX_WORKSPACE_OWNERSHIP=1: exit status $status"
            cat "$RUNNER_TEMP/remap.out"
            failed=$((failed + 1))
          fi
          [ "$(stat -c %u:%g "$RUNNER_TEMP/ws/theirs")" = 2000:2000 ] \
            && [ "$(stat -c %u:%g "$RUNNER_TEMP/ws-nested/nested")" = 1000:1000 ] \
            || { echo '::error::the other owner or the nested bind changed on the host'; ls -ln "$RUNNER_TEMP/ws" "$RUNNER_TEMP/ws-nested"; failed=$((failed + 1)); }
          # A /tmp volume is kept unless DENBOX_CLEAN_TMP=1.
          docker volume create denbox-tmp
          docker run --rm -v denbox-tmp:/tmp --entrypoint sh denbox -c 'touch /tmp/leftover'
          check 'a /tmp volume is kept by default' \
            docker run --rm -v denbox-tmp:/tmp denbox sh -c '[ -e /tmp/leftover ]'
          check 'DENBOX_CLEAN_TMP=1 empties the /tmp volume' \
            docker run --rm -e DENBOX_CLEAN_TMP=1 -v denbox-tmp:/tmp denbox sh -c '[ ! -e /tmp/leftover ]'
          docker volume rm denbox-tmp
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed check(s) failed"
            exit 1
          fi
      - name: Check a build at a commit of den
        timeout-minutes: 10
        run: |
          ref=$(git ls-remote https://github.com/NekoBend/den.git refs/heads/main | cut -f1)
          # The builder still holds the layers of the build above; only the
          # workspace stage can differ, when main has just moved.
          docker buildx build --load -t denbox-at-commit \
            --build-arg DEN_REF="$ref" -f docker/ubuntu/Dockerfile docker/ubuntu
          docker run --rm denbox-at-commit zsh -lc 'den --version'
          # A build at a ref den does not have must fail: a Dockerfile that
          # took main whatever DEN_REF said would pass the check above too.
          if docker buildx build --build-arg DEN_REF=refs/heads/no-such-ref-for-this-check \
              -f docker/ubuntu/Dockerfile docker/ubuntu >"$RUNNER_TEMP/no-ref.out" 2>&1; then
            echo '::error::a build at a ref den does not have did not fail'
            cat "$RUNNER_TEMP/no-ref.out"
            exit 1
          fi
          grep -i 'no-such-ref-for-this-check' "$RUNNER_TEMP/no-ref.out" >/dev/null \
            || { echo '::error::the failed build does not name the missing ref'; cat "$RUNNER_TEMP/no-ref.out"; exit 1; }
      - name: Check image drop-ins
        timeout-minutes: 5
        run: |
          trap 'status=$?; cat "$RUNNER_TEMP"/hooks-private.err "$RUNNER_TEMP"/hooks.out 2>/dev/null || :; exit "$status"' ERR
          # Use the Docker daemon's loaded image and default builder.
          # shellcheck disable=SC2016
          docker build -t denbox-hooks - <<'DOCKERFILE'
          FROM denbox
          RUN printf '%s\n' '#!/bin/sh' 'set -eu' \
                '[ "$(id -u)" = 0 ]' \
                '[ "$1:$2:$3" = /home/dev:1000:1000 ]' \
                'printf root-ok > /run/denbox-hook' \
                > /etc/denbox/init.d/10-probe && \
              printf '%s\n' '#!/bin/sh' 'set -eu' \
                '[ "$(id -u)" = 1000 ]' \
                '[ -L "$HOME/.config/hook-probe" ]' \
                'printf user-ok > "$HOME/.config/hook-probe/ran"' \
                > /etc/denbox/user-init.d/10-probe && \
              printf '%s\n' 'export DENBOX_PROBE=env-ok' \
                'export DENBOX_ENV_UIDS="${DENBOX_ENV_UIDS-}$(id -u) "' \
                > /etc/denbox/user-env.d/10-probe.sh && \
              printf '%s\n' /opt/hook-bin > /etc/denbox/user-path.d/10-probe.list && \
              printf '%s\n' 'd .config/hook-probe' > /etc/denbox/state-paths.d/10-probe.list && \
              printf '%s\n' '#!/bin/sh' 'exit 9' > /etc/denbox/user-init.d/20-private && \
              chmod 0700 /etc/denbox/user-init.d/20-private && \
              printf '%s\n' '#!/bin/sh' 'exit 9' > /etc/denbox/user-init.d/21-unreadable && \
              chmod 0711 /etc/denbox/user-init.d/21-unreadable && \
              chmod 0755 /etc/denbox/init.d/10-probe /etc/denbox/user-init.d/10-probe
          DOCKERFILE
          docker volume create denbox-hooks-state
          docker run --rm -v denbox-hooks-state:/state denbox-hooks sh -ec '
            [ "$(cat /run/denbox-hook)" = root-ok ]
            [ "$(cat "$HOME/.config/hook-probe/ran")" = user-ok ]
            [ "$DENBOX_PROBE" = env-ok ]
            [ "$DENBOX_ENV_UIDS" = "1000 " ]
            [ "$PATH" = /opt/hook-bin:/home/dev/.nvm/current/bin:/home/dev/.local/bin:/home/dev/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin ]
          ' 2>"$RUNNER_TEMP/hooks-private.err"
          grep -F 'not executable by dev: /etc/denbox/user-init.d/20-private' \
            "$RUNNER_TEMP/hooks-private.err"
          grep -F 'user hook failed or timed out (2): /etc/denbox/user-init.d/21-unreadable' \
            "$RUNNER_TEMP/hooks-private.err"
          docker run --rm --user dev denbox-hooks sh -ec '[ "$DENBOX_PROBE" = env-ok ] && [ "$DENBOX_ENV_UIDS" = "1000 " ]'
          docker build -t denbox-hooks-user-fail - <<'DOCKERFILE'
          FROM denbox-hooks
          RUN printf '%s\n' '#!/bin/sh' 'exit 7' > /etc/denbox/user-init.d/20-fail && \
              chmod 0755 /etc/denbox/user-init.d/20-fail
          DOCKERFILE
          docker run --rm -v denbox-hooks-state:/state denbox-hooks-user-fail true \
            >"$RUNNER_TEMP/hooks.out" 2>&1
          grep -F 'user hook failed or timed out (7): /etc/denbox/user-init.d/20-fail' \
            "$RUNNER_TEMP/hooks.out"
          docker build -t denbox-hooks-root-fail - <<'DOCKERFILE'
          FROM denbox-hooks
          RUN printf '%s\n' '#!/bin/sh' 'exit 8' > /etc/denbox/init.d/20-fail && \
              chmod 0755 /etc/denbox/init.d/20-fail
          DOCKERFILE
          if docker run --rm denbox-hooks-root-fail true >"$RUNNER_TEMP/hooks.out" 2>&1; then
            echo '::error::a failing root hook did not stop the start'
            cat "$RUNNER_TEMP/hooks.out"
            exit 1
          fi
          grep -F 'Root hook failed (8): /etc/denbox/init.d/20-fail' "$RUNNER_TEMP/hooks.out"
          docker volume rm denbox-hooks-state
