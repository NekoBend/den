name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  agents:
    name: agents (skills)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          # Linters are PINNED: unpinned, a release that widens the default rule
          # set turns CI red on code that did not change (ruff 0.16.0 did).
          # Bump these deliberately, with the findings fixed in the same commit.
          # questionary + rich are den's runtime deps: ty needs them importable to
          # resolve den/_ui.py's imports (no .venv in a fresh CI checkout).
          pip install ruff==0.16.0 ty==0.0.55 questionary rich
          sudo apt-get update && sudo apt-get install -y bats
      - name: Ruff lint
        run: ruff check agents den tests hatch_build.py
      - name: Ruff format check
        run: ruff format --check agents den tests hatch_build.py
      - name: Type check the den package (ty)
        run: ty check den
      - name: Lint generated parent prompts (agents/dist invariants)
        # The dist/*.md parent prompts are generated artifacts; their generator and
        # sources are not part of this repository, so CI cannot rebuild dist/ to
        # diff it. Instead assert the invariants the generator guarantees on the
        # committed output: no leaked HTML comments, ASCII dashes only (em/en/minus
        # are banned in shipped prompts), no trailing space, every section tag
        # closed, every tag REFERENCE resolving to a section that exists in that
        # file, and (for the 72-column parents) the prose wrap - a line that
        # sticks out is an edit that was pasted in without re-wrapping.
        run: |
          python3 - <<'PY'
          import glob, re, sys
          BAD = {chr(0x2014): "em-dash", chr(0x2013): "en-dash", chr(0x2212): "minus-sign"}
          BLOCK = re.compile(r"^</?([a-z_]+)>$")
          REF = re.compile(r"<([a-z_]+)>")
          PLACEHOLDER = {"name", "file", "n", "language", "dimension", "tool", "event"}
          WRAP = 78  # the prose wrap plus slack; table rows are exempt
          problems = []
          files = sorted(glob.glob("agents/dist/parents/**/*.md", recursive=True))
          for f in files:
              lines = open(f, encoding="utf-8").read().splitlines()
              # dist/weak/ is line-oriented on purpose (catalog table, one
              # disambiguation hint per line, one example field per line), so
              # the prose wrap applies to the 72-column parents only.
              wrapped = "/weak/" not in f
              open_tags, sections = [], set()
              for i, raw in enumerate(lines, 1):
                  if "<!--" in raw or "-->" in raw:
                      problems.append(f"{f}:{i}: HTML comment (or fragment) leaked into shipped prompt")
                  for ch, name in BAD.items():
                      if ch in raw:
                          problems.append(f"{f}:{i}: {name} U+{ord(ch):04X} (parent prompts must use ASCII dashes)")
                  if raw != raw.rstrip():
                      problems.append(f"{f}:{i}: trailing whitespace")
                  if wrapped and len(raw) > WRAP and not raw.lstrip().startswith("|"):
                      problems.append(f"{f}:{i}: line is {len(raw)} chars (wrap at {WRAP}; re-wrap the paragraph)")
                  m = BLOCK.match(raw.strip())
                  if m:
                      tag = m.group(1)
                      if raw.strip().startswith("</"):
                          if not open_tags or open_tags[-1] != tag:
                              problems.append(f"{f}:{i}: </{tag}> does not close the open section")
                          else:
                              open_tags.pop()
                      else:
                          open_tags.append(tag); sections.add(tag)
              for t in open_tags:
                  problems.append(f"{f}: <{t}> is never closed")
              for i, raw in enumerate(lines, 1):
                  if BLOCK.match(raw.strip()):
                      continue
                  for ref in REF.findall(raw):
                      if ref not in sections and ref not in PLACEHOLDER:
                          problems.append(f"{f}:{i}: reference <{ref}> has no such section in this file")
          if problems:
              print("\n".join(problems)); sys.exit(1)
          print(f"agents/dist: {len(files)} parent prompt(s) clean")
          PY
      - name: Bats (run-checks)
        run: bats tests/agents/run-checks.bats

  tests:
    name: tests (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml
          # ripgrep is the fast backend of find-references.py and
          # check-broken-refs.py, and tests/agents compares it against the
          # Python-walk fallback file by file. The runner image does not ship
          # it, and without it BOTH legs of every parity test would run the
          # fallback and pass without comparing anything, so the tests fail
          # loudly rather than skip: install it here.
          sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Pytest (verification scripts)
        run: python3 -m pytest tests/agents
      - name: den-free skill copies (agents/dist/skills) are current
        run: python3 -m den._portable --check
      - name: Pytest (den CLI)
        run: python3 -m pytest tests/den

  packaging:
    name: packaging (wheel + sourceless install)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install uv
        run: pip install uv
      - name: Build sdist + wheel
        run: uv build -o dist .
      - name: Assert wheel + sdist are complete and clean
        run: |
          python3 - <<'PY'
          import glob, tarfile, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          bad = [n for n in names if "/tests/" in n or n.endswith((".pyc", ".bats"))]
          assert not bad, f"unwanted files in wheel: {bad}"
          # the POSIX helper executables must survive into the wheel bundle,
          # else `den install shell --bin` installs nothing from a wheel.
          assert any(n.endswith("_data/shell/posix/bin/fixids") for n in names), \
              "shell/posix/bin/fixids missing from wheel"
          # the parent prompts (agents/dist) must survive into the sdist too,
          # else a sdist-built install loses `--with-parent` (unanchored dist/).
          sdist = glob.glob("dist/*.tar.gz")[0]
          members = tarfile.open(sdist).getnames()
          assert any("/agents/dist/parents/CLAUDE.md" in m for m in members), \
              "agents/dist missing from sdist"
          assert any("/agents/dist/parents/weak/AGENTS.md" in m for m in members), \
              "agents/dist/weak (weak-profile parent) missing from sdist"
          print(f"wheel clean ({len(names)} entries), sdist has agents/dist")
          PY
      - name: Install from sdist + smoke test
        run: |
          # install from the SDIST (uv tool install git+URL may build via sdist);
          # this is the path that the unanchored dist/ ignore broke.
          python3 -m venv /tmp/denv
          /tmp/denv/bin/pip install dist/*.tar.gz
          # run from /tmp (away from the checkout) so content resolves from the
          # bundled den/_data, not the repo root -- this is what git+URL gives.
          cd /tmp
          /tmp/denv/bin/den --version
          # cheatsheets deploy from the bundled content (den cheat moved to the shell)
          XDG_DATA_HOME=/tmp/dendata /tmp/denv/bin/den install cheatsheets
          test -f /tmp/dendata/den/cheatsheets/shell/one-liners.md
          /tmp/denv/bin/den install skills --target /tmp/sk --with-parent
          test -f /tmp/sk/skills/coding/SKILL.md
          grep -q "/tmp/sk/skills/coding/shared/reference" /tmp/sk/skills/coding/SKILL.md
          test -f /tmp/sk/CLAUDE.md   # parent prompt installed (needs agents/dist)
          /tmp/denv/bin/den install shell --dry-run | grep -q '\[dry\]'
          # --bin path works from the wheel bundle (non-tty, so the flag is needed)
          /tmp/denv/bin/den install shell --no-extras --bin
          test -x "$HOME/.local/bin/fixids"

  shell:
    name: shell env
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: ShellCheck (errors only)
        run: |
          shellcheck --severity=error \
            shell/posix/*.sh \
            shell/bash/*.bash \
            tests/shell/*.sh \
            shell/posix/bin/*
      - name: PSScriptAnalyzer (errors only)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $files = Get-ChildItem shell/pwsh/*.ps1 -File
          # -Settings is a hashtable on purpose: with no -Settings the analyzer
          # auto-discovers a PSScriptAnalyzerSettings.psd1 from the checkout,
          # and such a profile can set CustomRulePath, which is Import-Module'd
          # (code execution on the runner from whatever this job checked out).
          $settings = @{ Severity = @('Error'); IncludeDefaultRules = $true }
          $errs = $files | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_.FullName -Settings $settings
          }
          if ($errs) {
            $errs | Format-Table -AutoSize
            throw "PSScriptAnalyzer found $(@($errs).Count) error(s)"
          }
          Write-Output 'PSScriptAnalyzer: 0 errors'

  shell-tests:
    name: shell functional tests (bash/zsh/pwsh)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # CI never builds the dev image (docker/ubuntu/Dockerfile), so at least
      # run BuildKit's Dockerfile checks on it; --check builds nothing.
      - name: Check the dev image Dockerfile
        run: docker buildx build --check -f docker/ubuntu/Dockerfile docker/ubuntu
      # The image installs two apt layers, one of them PowerShell from
      # packages.microsoft.com. Uncached, that step took 39m8s, 29m36s, and
      # 11m52s on three of the last twelve runs (it succeeded every time; the
      # cost was waiting, not failing). The layers only change when the
      # Dockerfile does, so cache them across runs.
      - name: Build the shell test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: tests/shell/Dockerfile
          tags: den-shell-test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the shell tests
        run: docker run --rm den-shell-test

  windows:
    name: windows (pytest + pwsh smoke)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml
      - name: Pytest (den CLI) on native Windows
        # Exercises the Windows code paths (real PowerShell $PROFILE query,
        # LOCALAPPDATA, cmd/Clink staging, coreutils readline strip) that the
        # ubuntu jobs can only reach through mocks. PYTHONUTF8 runs the suite in
        # UTF-8 mode (den's text artifacts are UTF-8) so implicit reads don't hit
        # Windows' cp1252 default.
        env:
          PYTHONUTF8: "1"
        run: python -m pytest tests/den
      - name: pwsh init.ps1 loads and defines functions at global scope
        # Catches Windows-only pwsh runtime/load errors and global-scope leaks
        # (the class that broke completion.ps1) which PSScriptAnalyzer cannot see.
        shell: pwsh
        run: |
          # This job runs via `pwsh -Command`, which the _DenInteractive gate treats
          # as non-interactive, so force the interactive load path to deterministically
          # exercise the gated wrappers/aliases/completion (and the de-shadow check).
          $env:_DEN_FORCE_INTERACTIVE = '1'
          . .\shell\pwsh\init.ps1
          # ports=functions.ps1, cheat=cheat.ps1, pcp=parallel.ps1 (ports/pcp/cheat are
          # ungated and load regardless); this asserts init.ps1 defined them globally.
          $expected = 'ports', 'cheat', 'pcp'
          $missing = $expected | Where-Object { -not (Get-Command $_ -ErrorAction SilentlyContinue) }
          if ($missing) { throw "init.ps1 did not define at global scope: $($missing -join ', ')" }
          Write-Output "pwsh init.ps1 loaded; global functions present: $($expected -join ', ')"
          # The forced interactive load above means the wrappers/aliases are present, so
          # den's functions must WIN over the Windows-only built-in cp/mv/rm/ls/cat/gc/cd
          # aliases (an alias outranks a function; den removes the builtins).
          $collide = 'ls', 'cat', 'cp', 'mv', 'rm', 'gc', 'cd'
          $shadowed = foreach ($n in $collide) {
            $c = Get-Command $n -ErrorAction SilentlyContinue
            if ($c -and $c.CommandType -eq 'Alias') { "$n->$($c.Definition)" }
          }
          if ($shadowed) { throw "den functions shadowed by builtin aliases: $($shadowed -join ', ')" }
          Write-Output "no builtin alias shadows den's wrappers: $($collide -join ', ')"
      - name: cmd back/fwd shims (lists seeded by hand)
        # starship.lua's Clink filter keeps _DEN_DIRBACK / _DEN_DIRFWD and cannot
        # run here, so seed the lists and check what back.cmd / fwd.cmd print,
        # return, change and leave in _DEN_DIRNAV. The Linux Lua harness covers
        # the filter; this is the only run of the batch code itself. 'a b' and
        # 'c (1)' need quoting all the way through, and 'd!e' survives only
        # while delayed expansion is on just around !var! reads; in `back -l`,
        # +1 is %USERPROFILE% itself (shown as ~) and +2 only shares its prefix
        # (shown in full). A cmd step does not stop on a failed command, so every
        # check exits 1 itself. A shim's return code is read from ERRORLEVEL on
        # the next line, and `verify other` sets it to 1 before a call that
        # should succeed, so a 0 left by an earlier check cannot pass for the
        # shim's.
        shell: cmd
        run: |
          set "BIN=%GITHUB_WORKSPACE%\shell\cmd\bin"
          set "T=%RUNNER_TEMP%\dh"
          mkdir "%T%\start" "%T%\a b" "%T%\c (1)" || exit /b 1
          set "USERPROFILE=%T%"
          cd /d "%T%\start"
          set "_DEN_DIRBACK=%T%\a b|%T%\c (1)"
          set "_DEN_DIRFWD=%T%|%T%2"
          set "_DEN_DIRNAV="
          verify other 2>nul
          call "%BIN%\back.cmd" -l >"%T%\got.txt"
          if not "%ERRORLEVEL%"=="0" exit /b 1
          >"%T%\want.txt" echo(  2  ~\a b
          >>"%T%\want.txt" echo(  1  ~\c (1)
          >>"%T%\want.txt" echo(  *  ~\start
          >>"%T%\want.txt" echo( +1  ~
          >>"%T%\want.txt" echo( +2  %T%2
          fc "%T%\want.txt" "%T%\got.txt" || exit /b 1
          call "%BIN%\back.cmd" 0 2>"%T%\got.txt"
          if not "%ERRORLEVEL%"=="1" exit /b 1
          >"%T%\want.txt" echo(usage: back [N ^| -l]  ^(N=positive integer, default 1^)
          fc "%T%\want.txt" "%T%\got.txt" || exit /b 1
          call "%BIN%\back.cmd" 9 2>"%T%\got.txt"
          if not "%ERRORLEVEL%"=="1" exit /b 1
          >"%T%\want.txt" echo(back: history has 2 back entries, cannot go back 9
          fc "%T%\want.txt" "%T%\got.txt" || exit /b 1
          if /i not "%CD%"=="%T%\start" exit /b 1
          if defined _DEN_DIRNAV exit /b 1
          verify other 2>nul
          call "%BIN%\back.cmd" 2
          if not "%ERRORLEVEL%"=="0" exit /b 1
          if /i not "%CD%"=="%T%\a b" exit /b 1
          if not "%_DEN_DIRNAV%"=="back:2" exit /b 1
          set "_DEN_DIRBACK="
          set "_DEN_DIRFWD=%T%\c (1)|%T%\start"
          set "_DEN_DIRNAV="
          verify other 2>nul
          call "%BIN%\fwd.cmd" 2
          if not "%ERRORLEVEL%"=="0" exit /b 1
          if /i not "%CD%"=="%T%\start" exit /b 1
          if not "%_DEN_DIRNAV%"=="fwd:2" exit /b 1
          set "_DEN_DIRNAV="
          rmdir "%T%\c (1)" || exit /b 1
          call "%BIN%\fwd.cmd" 2>"%T%\got.txt"
          if not "%ERRORLEVEL%"=="1" exit /b 1
          >"%T%\want.txt" echo(fwd: %T%\c (1) no longer exists, dropped from history
          fc "%T%\want.txt" "%T%\got.txt" || exit /b 1
          if /i not "%CD%"=="%T%\start" exit /b 1
          if not "%_DEN_DIRNAV%"=="dropfwd:1" exit /b 1
          set "_DEN_DIRNAV="
          call "%BIN%\fwd.cmd" 0 2>"%T%\got.txt"
          if not "%ERRORLEVEL%"=="1" exit /b 1
          >"%T%\want.txt" echo(usage: fwd [N]  ^(N=positive integer, default 1^)
          fc "%T%\want.txt" "%T%\got.txt" || exit /b 1
          set "_DEN_DIRFWD=%T%\start"
          call "%BIN%\fwd.cmd" 2 2>"%T%\got.txt"
          if not "%ERRORLEVEL%"=="1" exit /b 1
          >"%T%\want.txt" echo(fwd: history has 1 forward entry, cannot go forward 2
          fc "%T%\want.txt" "%T%\got.txt" || exit /b 1
          if /i not "%CD%"=="%T%\start" exit /b 1
          if defined _DEN_DIRNAV exit /b 1
          mkdir "%T%\d!e" || exit /b 1
          set "_DEN_DIRBACK=%T%\d!e"
          set "_DEN_DIRFWD="
          verify other 2>nul
          call "%BIN%\back.cmd" -l >"%T%\got.txt"
          if not "%ERRORLEVEL%"=="0" exit /b 1
          >"%T%\want.txt" echo(  1  ~\d!e
          >>"%T%\want.txt" echo(  *  ~\start
          fc "%T%\want.txt" "%T%\got.txt" || exit /b 1
          verify other 2>nul
          call "%BIN%\back.cmd"
          if not "%ERRORLEVEL%"=="0" exit /b 1
          if /i not "%CD%"=="%T%\d!e" exit /b 1
          if not "%_DEN_DIRNAV%"=="back:1" exit /b 1
          set "_DEN_DIRNAV="
          rmdir "%T%\a b" || exit /b 1
          set "_DEN_DIRBACK=%T%\a b"
          call "%BIN%\back.cmd" 2>"%T%\got.txt"
          if not "%ERRORLEVEL%"=="1" exit /b 1
          >"%T%\want.txt" echo(back: %T%\a b no longer exists, dropped from history
          fc "%T%\want.txt" "%T%\got.txt" || exit /b 1
          if /i not "%CD%"=="%T%\d!e" exit /b 1
          if not "%_DEN_DIRNAV%"=="dropback:1" exit /b 1
          echo cmd back/fwd shims: ok
      - name: cmd dg.cmd hashes, checks, compares and verifies files
        # dg.cmd (certutil) runs nowhere else: the Linux jobs have no cmd.
        # The fixture bytes are fixed, so every digest below is a constant
        # (md5sum/sha256sum/sha512sum of the same bytes): a.txt is "hello",
        # 68 65 6c 6c 6f (set /p writes no line end), b.txt is those 5 bytes
        # plus 0d 0a (echo ends every line with CR LF), and c.txt, "sp ace.txt",
        # 256 and "a!b!&c.txt" are byte copies of them. The runner writes this
        # script with CRLF line ends and starts it as
        # cmd /D /E:ON /V:OFF /S /C "CALL <script>.cmd", so "!" is literal
        # here, the :labels below are found, and exit /b ends the step with
        # that code. Each run is checked on its exit code and on stdout and
        # stderr, byte for byte.
        shell: cmd
        run: |
          setlocal EnableExtensions DisableDelayedExpansion
          set "DG=%GITHUB_WORKSPACE%\shell\cmd\bin\dg.cmd"
          set "DIGEST=%GITHUB_WORKSPACE%\shell\cmd\bin\digest.cmd"
          set "FC=%SystemRoot%\System32\fc.exe"
          set "W=%RUNNER_TEMP%\dg-ci"
          set "O=%RUNNER_TEMP%\dg-stdout.txt"
          set "R=%RUNNER_TEMP%\dg-stderr.txt"
          set "E=%RUNNER_TEMP%\dg-want-stdout.txt"
          set "X=%RUNNER_TEMP%\dg-want-stderr.txt"
          set "N=0"
          set "FAILS=0"
          rem dg.cmd makes its per-hash directories under %TEMP%: give it one
          rem of its own, so the last check can see that none is left behind.
          set "TEMP=%RUNNER_TEMP%\dg-tmp"
          set "MD5_A=5d41402abc4b2a76b9719d911017c592"
          set "SHA256_A=2cf24dba5fb0a30e26e83b2ac5b9e29e1b161e5c1fa7425e73043362938b9824"
          set "SHA256_A_UC=2CF24DBA5FB0A30E26E83B2AC5B9E29E1B161E5C1FA7425E73043362938B9824"
          set "SHA512_A=9b71d224bd62f3785d96d46ad3ea3d73319bfbc2890caadae2dff72519673ca72323c3d99ba5c11d7c7acc6e14b8c5da0c4663475c2e5c3adef46f73bcdec043"
          set "MD5_B=af5597c29467a96523a70787c319f4db"
          set "SHA256_B=cd2eca3535741f27a8ae40c31b0c41d4057a7a7b912b33b9aed86485d1c84676"
          set "SHA256_EMPTY=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

          if exist "%W%" rd /s /q "%W%"
          if exist "%TEMP%" rd /s /q "%TEMP%"
          md "%W%" || exit /b 1
          md "%TEMP%" || exit /b 1
          cd /d "%W%" || exit /b 1
          <nul >a.txt set /p "=hello"
          >b.txt echo hello
          type nul >empty.txt
          copy /b a.txt c.txt >nul
          copy /b a.txt "sp ace.txt" >nul
          copy /b a.txt 256 >nul
          copy /b b.txt "a!b!&c.txt" >nul
          rem ok.sums: 9 CRLF lines, 603 bytes; bad.sums: 3 CRLF lines, 173 bytes.
          rem Its last line is GNU-escaped (a leading backslash) with no \\ to undo.
          >ok.sums echo(# dg -c fixture: comment and blank lines are skipped
          >>ok.sums echo(
          >>ok.sums echo(%SHA256_A%  a.txt
          >>ok.sums echo(%MD5_B% *b.txt
          >>ok.sums echo(SHA512 (sp ace.txt) = %SHA512_A%
          >>ok.sums echo(%SHA256_B%  a!b!^&c.txt
          >>ok.sums echo(MD5 (c.txt) = %MD5_A%
          >>ok.sums echo(SHA256 (256) = %SHA256_A%
          >>ok.sums echo(\%SHA256_A%  c.txt
          >bad.sums echo(%SHA256_A%  b.txt
          >>bad.sums echo(MD5 (missing.txt) = %MD5_A%
          >>bad.sums echo(%MD5_A%  sp ace.txt
          call :size a.txt 5
          call :size b.txt 7
          call :size empty.txt 0
          call :size ok.sums 603
          call :size bad.sums 173

          rem One file prints the bare hash, for every algo token.
          type nul >"%X%"
          >"%E%" echo(%SHA256_A%
          call "%DG%" a.txt >"%O%" 2>"%R%"
          call :expect %errorlevel% 0 "dg a.txt: default sha256"
          call "%DG%" 256 a.txt >"%O%" 2>"%R%"
          call :expect %errorlevel% 0 "dg 256 a.txt"
          call "%DG%" sha256 a.txt >"%O%" 2>"%R%"
          call :expect %errorlevel% 0 "dg sha256 a.txt"
          call "%DG%" -- 256 >"%O%" 2>"%R%"
          call :expect %errorlevel% 0 "dg -- 256: hashes the file named 256"
          >"%E%" echo(%MD5_A%
          call "%DG%" 5 a.txt >"%O%" 2>"%R%"
          call :expect %errorlevel% 0 "dg 5 a.txt"
          call "%DG%" md5 a.txt >"%O%" 2>"%R%"
          call :expect %errorlevel% 0 "dg md5 a.txt"
          >"%E%" echo(%SHA512_A%
          call "%DG%" 512 a.txt >"%O%" 2>"%R%"
          call :expect %errorlevel% 0 "dg 512 a.txt"
          call "%DG%" SHA512 a.txt >"%O%" 2>"%R%"
          call :expect %errorlevel% 0 "dg SHA512 a.txt: algo name in any case"

          rem Several files print hash and name per line.
          >"%E%" echo(%SHA256_A%  a.txt
          >>"%E%" echo(%SHA256_B%  b.txt
          call "%DG%" a.txt b.txt >"%O%" 2>"%R%"
          call :expect %errorlevel% 0 "dg a.txt b.txt"
          >"%E%" echo(%MD5_A%  a.txt
          >>"%E%" echo(%MD5_A%  sp ace.txt
          >>"%E%" echo(%MD5_B%  a!b!^&c.txt
          call "%DG%" md5 a.txt "sp ace.txt" "a!b!&c.txt" >"%O%" 2>"%R%"
          call :expect %errorlevel% 0 "dg md5 on three files incl. a spaced and a bang-amp name"

          rem FILE HASH: OK exits 0, MISMATCH exits 1.
          >"%E%" echo(OK  a.txt
          call "%DG%" a.txt %SHA256_A% >"%O%" 2>"%R%"
          call :expect %errorlevel% 0 "dg a.txt sha256-hex: OK"
          call "%DG%" a.txt "SHA256: %SHA256_A_UC%" >"%O%" 2>"%R%"
          call :expect %errorlevel% 0 "dg a.txt 'SHA256: UPPERCASE-HEX': OK"
          >"%E%" echo(OK  sp ace.txt
          call "%DG%" 512 "sp ace.txt" %SHA512_A% >"%O%" 2>"%R%"
          call :expect %errorlevel% 0 "dg 512 sp-ace.txt sha512-hex: OK"
          >"%E%" echo(MISMATCH  a.txt
          >>"%E%" echo(  expected %MD5_B%
          >>"%E%" echo(  actual   %MD5_A%
          call "%DG%" a.txt %MD5_B% >"%O%" 2>"%R%"
          call :expect %errorlevel% 1 "dg a.txt md5-of-b.txt: MISMATCH"
          >"%E%" echo(MISMATCH  a!b!^&c.txt
          >>"%E%" echo(  expected %SHA256_A%
          >>"%E%" echo(  actual   %SHA256_B%
          call "%DG%" "a!b!&c.txt" %SHA256_A% >"%O%" 2>"%R%"
          call :expect %errorlevel% 1 "dg bang-amp-name sha256-of-a.txt: MISMATCH"

          rem An algo token or prefix that disagrees with the length exits 2.
          type nul >"%E%"
          >"%X%" echo(dg: the expected hash is 64 hex digits (SHA256), not MD5
          call "%DG%" md5 a.txt %SHA256_A% >"%O%" 2>"%R%"
          call :expect %errorlevel% 2 "dg md5 a.txt sha256-hex: algo disagrees"
          call "%DG%" a.txt md5:%SHA256_A% >"%O%" 2>"%R%"
          call :expect %errorlevel% 2 "dg a.txt md5:sha256-hex: prefix disagrees"
          type nul >"%X%"

          rem -e: SAME exits 0, DIFFERENT exits 1 with both hashes.
          >"%E%" echo(SAME  a.txt  sp ace.txt
          call "%DG%" -e a.txt "sp ace.txt" >"%O%" 2>"%R%"
          call :expect %errorlevel% 0 "dg -e a.txt sp-ace.txt: SAME"
          >"%E%" echo(DIFFERENT  a.txt  a!b!^&c.txt
          >>"%E%" echo(  %MD5_A%  a.txt
          >>"%E%" echo(  %MD5_B%  a!b!^&c.txt
          call "%DG%" -e md5 a.txt "a!b!&c.txt" >"%O%" 2>"%R%"
          call :expect %errorlevel% 1 "dg -e md5 a.txt bang-amp-name: DIFFERENT"

          rem -c: GNU and BSD lines from CRLF files, names relative to here.
          >"%E%" echo(a.txt: OK
          >>"%E%" echo(b.txt: OK
          >>"%E%" echo(sp ace.txt: OK
          >>"%E%" echo(a!b!^&c.txt: OK
          >>"%E%" echo(c.txt: OK
          >>"%E%" echo(256: OK
          >>"%E%" echo(c.txt: OK
          call "%DG%" -c ok.sums >"%O%" 2>"%R%"
          call :expect %errorlevel% 0 "dg -c ok.sums: every entry OK"
          >"%E%" echo(b.txt: FAILED
          >>"%E%" echo(missing.txt: MISSING
          >>"%E%" echo(sp ace.txt: OK
          >"%X%" echo(dg: 1 FAILED, 1 MISSING of 3 checked
          call "%DG%" -c bad.sums >"%O%" 2>"%R%"
          call :expect %errorlevel% 1 "dg -c bad.sums: FAILED and MISSING"
          type nul >"%X%"

          rem digest.cmd hands its arguments to dg.cmd, whose exit code ends it.
          >"%E%" echo(%MD5_A%
          call "%DIGEST%" 5 a.txt >"%O%" 2>"%R%"
          call :expect %errorlevel% 0 "digest 5 a.txt"
          >"%E%" echo(MISMATCH  a.txt
          >>"%E%" echo(  expected %MD5_B%
          >>"%E%" echo(  actual   %MD5_A%
          call "%DIGEST%" a.txt %MD5_B% >"%O%" 2>"%R%"
          call :expect %errorlevel% 1 "digest a.txt md5-of-b.txt: exit 1 passes through"
          type nul >"%E%"
          >"%X%" echo(dg: the expected hash is 64 hex digits (SHA256), not MD5
          call "%DIGEST%" md5 a.txt %SHA256_A% >"%O%" 2>"%R%"
          call :expect %errorlevel% 2 "digest md5 a.txt sha256-hex: exit 2 passes through"

          rem A 0-byte file: certutil refuses it, so dg.cmd answers with the
          rem constant digest of empty input.
          type nul >"%X%"
          >"%E%" echo(%SHA256_EMPTY%
          call "%DG%" empty.txt >"%O%" 2>"%R%"
          call :expect %errorlevel% 0 "dg empty.txt: the empty-input SHA-256"
          >"%E%" echo(d41d8cd98f00b204e9800998ecf8427e
          call "%DG%" 5 empty.txt >"%O%" 2>"%R%"
          call :expect %errorlevel% 0 "dg 5 empty.txt: the empty-input MD5"
          >"%E%" echo(OK  empty.txt
          call "%DG%" empty.txt %SHA256_EMPTY% >"%O%" 2>"%R%"
          call :expect %errorlevel% 0 "dg empty.txt empty-sha256: OK"

          rem Every hash removed the directory it made.
          set /a "N+=1"
          dir /b /ad "%TEMP%\dg-*" >nul 2>&1
          if errorlevel 1 goto :tmp_clean
          set /a "FAILS+=1"
          echo ::error::dg.cmd left dg-* directories in %TEMP%
          dir /b /ad "%TEMP%\dg-*"
          :tmp_clean

          if not "%FAILS%"=="0" goto :failed
          echo dg.cmd: all %N% checks passed
          exit /b 0
          :failed
          echo ::error::dg.cmd: %FAILS% of %N% checks failed
          rem Diagnostics: certutil's raw output as text and as hex, then one
          rem hash through a copy of dg.cmd without "@echo off", so the log
          rem shows every command it ran with its values expanded.
          echo ::group::certutil -hashfile a.txt SHA256, raw
          certutil -hashfile a.txt SHA256 >"%RUNNER_TEMP%\dg-raw.txt" 2>&1
          echo certutil exit %errorlevel%
          type "%RUNNER_TEMP%\dg-raw.txt"
          certutil -f -encodehex "%RUNNER_TEMP%\dg-raw.txt" "%RUNNER_TEMP%\dg-raw.hex" 4 >nul
          type "%RUNNER_TEMP%\dg-raw.hex"
          echo ::endgroup::
          echo ::group::the hex check dg.cmd applies, on its own
          set "_h=2cf24dba5fb0a30e26e83b2ac5b9e29e1b161e5c1fa7425e73043362938b9824"
          set _h
          set _h 2>nul | findstr /r /x /c:"_h=[0123456789abcdefABCDEF][0123456789abcdefABCDEF]*"
          echo findstr exit %errorlevel%
          set "_h="
          echo ::endgroup::
          echo ::group::dg.cmd a.txt, traced
          rem The step runs with echo off, so the copy turns it on explicitly.
          powershell -NoProfile -Command "(Get-Content -LiteralPath $env:DG) -replace '^@echo off$','@echo on' | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'dg-trace.cmd')"
          call "%RUNNER_TEMP%\dg-trace.cmd" a.txt
          echo dg-trace exit %errorlevel%
          echo ::endgroup::
          exit /b 1

          rem :expect RC WANT LABEL - the run exited RC; it passes when RC is
          rem WANT and its stdout and stderr hold the bytes in E and X.
          :expect
          set /a "N+=1"
          call :match %1 %2
          if errorlevel 1 goto :expect_fail
          echo ok   %~3
          exit /b 0
          :expect_fail
          set /a "FAILS+=1"
          echo ::error::dg.cmd: %~3: exit %~1, want %~2
          call :dump
          exit /b 0

          rem :match RC WANT - errorlevel 0 when RC is WANT, O equals E and R equals X.
          :match
          if not "%~1"=="%~2" exit /b 1
          call :same "%E%" "%O%"
          if errorlevel 1 exit /b 1
          call :same "%X%" "%R%"
          if errorlevel 1 exit /b 1
          exit /b 0

          rem :same A B - errorlevel 0 when the two files hold the same bytes.
          rem Sizes go first, so an empty file on one side never reaches fc.
          :same
          if not "%~z1"=="%~z2" exit /b 1
          if "%~z1"=="0" exit /b 0
          "%FC%" /b "%~1" "%~2" >nul 2>&1
          if errorlevel 1 exit /b 1
          exit /b 0

          :dump
          echo --- want stdout:
          type "%E%"
          echo --- got stdout:
          type "%O%"
          echo --- want stderr:
          type "%X%"
          echo --- got stderr:
          type "%R%"
          exit /b 0

          rem :size FILE BYTES - a fixture has the byte count it was built with.
          :size
          set /a "N+=1"
          if "%~z1"=="%~2" exit /b 0
          set /a "FAILS+=1"
          echo ::error::dg.cmd: fixture %~1 is %~z1 bytes, want %~2
          exit /b 0
