[project]
name = "den"
version = "0.1.0"
description = "den: unified CLI for LLM-assisted development (verify, memory, hooks)"
requires-python = ">=3.12"
# Only used for the interactive UI; the CLI degrades to plain stdin prompts if
# they are missing (see den/_ui.py).
dependencies = [
    "questionary>=2.0",
    "rich>=13.0",
]

[project.scripts]
den = "den.cli:main"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Explicit, so a ruff release that widens its defaults cannot turn CI red on
# code that did not change (ruff 0.16.0 did exactly that). Deliberately out:
# PLW1510 (subprocess.run without check= - this codebase inspects returncode
# itself), BLE001 and S110 (broad except / except-pass around optional tools,
# where degrading quietly is the intended behavior).
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["den"]
exclude = ["**/__pycache__", "**/*.pyc", "**/.pytest_cache", "**/tests"]

# Deployable content (skills, shared, dist, cheatsheets, shell) is bundled into
# den/_data/ by hatch_build.py, which excludes tests/caches that a static
# force-include cannot filter. _content.py mirrors this layout, falling back to
# the repo root when running from a checkout.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
