<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>den board</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f6f3;
    --panel: #ffffff;
    --ink: #191918;
    --muted: #6e6d66;
    --line: #e3e2db;
    --accent: #35766e;
    --flash: #d9efe7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #161615;
      --panel: #1e1e1c;
      --ink: #e8e7e0;
      --muted: #a09f96;
      --line: #33322e;
      --accent: #5fb3a8;
      --flash: #23423a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", sans-serif;
  }
  main { max-width: 680px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  header { margin-bottom: 1rem; }
  h1 { font-size: 1.5rem; margin: 0; line-height: 1.3; }
  .sub { color: var(--muted); font-size: 0.8rem; word-break: break-all; }
  #offline {
    display: none;
    background: #d03b3b;
    color: #ffffff;
    border-radius: 6px;
    padding: 0.4rem 0.8rem;
    margin-bottom: 1rem;
    font-size: 0.85rem;
  }
  #buttons {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 0.5rem;
    margin-bottom: 0.75rem;
  }
  #buttons button {
    font: inherit;
    font-weight: 600;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-top: 3px solid var(--accent);
    border-radius: 8px;
    padding: 0.7rem 0.5rem;
    cursor: pointer;
  }
  #buttons button:hover { border-color: var(--accent); }
  #buttons button.sent { background: var(--flash); }
  #buttons button .key { color: var(--muted); font-weight: 400; font-size: 0.75rem; }
  #note {
    width: 100%;
    min-height: 4.5rem;
    font: inherit;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.6rem 0.8rem;
    resize: vertical;
  }
  #note:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .hint { color: var(--muted); font-size: 0.78rem; margin: 0.3rem 0 1.5rem; }
  h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
    padding-bottom: 0.4rem;
    margin: 0 0 0.4rem;
  }
  #reports { list-style: none; margin: 0; padding: 0; }
  #reports li {
    display: flex;
    gap: 0.6rem;
    align-items: baseline;
    padding: 0.45rem 0.2rem 0.45rem 0.6rem;
    border-bottom: 1px solid var(--line);
    border-left: 3px solid var(--line);
    margin-bottom: 2px;
  }
  #reports .t { color: var(--muted); font-size: 0.78rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #reports .b { font-weight: 600; font-size: 0.85rem; white-space: nowrap; }
  #reports .x { white-space: pre-wrap; word-break: break-word; }
  #empty { color: var(--muted); font-size: 0.85rem; }
  footer { margin-top: 2rem; color: var(--muted); font-size: 0.78rem; word-break: break-all; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">den board</h1>
    <div class="sub" id="root"></div>
  </header>
  <div id="offline">Server not reachable. Restart it with: <code>den board</code></div>
  <section id="buttons" aria-label="report buttons"></section>
  <textarea id="note" placeholder="Optional note - attached to the next button press"></textarea>
  <p class="hint">Keys 1-9 press a button (when the note box is not focused).
    Ctrl+Enter sends the note with the first button.</p>
  <h2>Reports</h2>
  <ul id="reports"></ul>
  <div id="empty">No reports yet.</div>
  <footer id="foot"></footer>
</main>
<script>
"use strict";
(() => {
  const $ = (id) => document.getElementById(id);
  let buttons = [];

  const setOffline = (off) => { $("offline").style.display = off ? "block" : "none"; };

  const renderButtons = () => {
    const box = $("buttons");
    box.textContent = "";
    buttons.forEach((b, i) => {
      const el = document.createElement("button");
      el.type = "button";
      if (b.color) { el.style.borderTopColor = b.color; }
      el.append(document.createTextNode(b.label || b.id));
      if (i < 9) {
        el.append(" ");
        const k = document.createElement("span");
        k.className = "key";
        k.textContent = String(i + 1);
        el.append(k);
      }
      el.addEventListener("click", () => send(b, el));
      box.append(el);
    });
  };

  const send = async (b, el) => {
    const text = $("note").value.trim();
    try {
      const r = await fetch("/api/report", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ button: b.id, text }),
      });
      if (!r.ok) { throw new Error(String(r.status)); }
      $("note").value = "";
      if (el) {
        el.classList.add("sent");
        setTimeout(() => el.classList.remove("sent"), 450);
      }
      setOffline(false);
      await loadReports();
    } catch {
      setOffline(true);
    }
  };

  const fmtTime = (iso) => {
    const d = new Date(iso);
    return Number.isNaN(d.getTime()) ? iso : d.toLocaleTimeString();
  };

  const loadReports = async () => {
    let data;
    try {
      const r = await fetch("/api/reports?limit=100");
      data = await r.json();
      setOffline(false);
    } catch {
      setOffline(true);
      return;
    }
    const list = $("reports");
    list.textContent = "";
    const reports = (data.reports || []).slice().reverse();
    $("empty").style.display = reports.length ? "none" : "block";
    const byId = Object.fromEntries(buttons.map((b) => [b.id, b]));
    for (const rep of reports) {
      const li = document.createElement("li");
      const meta = byId[rep.button] || {};
      if (meta.color) { li.style.borderLeftColor = meta.color; }
      const t = document.createElement("span");
      t.className = "t";
      t.textContent = fmtTime(rep.ts);
      const b = document.createElement("span");
      b.className = "b";
      if (meta.color) { b.style.color = meta.color; }
      b.textContent = meta.label || rep.button;
      const x = document.createElement("span");
      x.className = "x";
      x.textContent = rep.text || "";
      li.append(t, b, x);
      list.append(li);
    }
  };

  document.addEventListener("keydown", (e) => {
    if (e.target === $("note")) {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && buttons.length) {
        e.preventDefault();
        send(buttons.find((b) => b.id === "note") || buttons[0], null);
      }
      return;
    }
    const n = Number.parseInt(e.key, 10);
    if (n >= 1 && n <= Math.min(buttons.length, 9)) {
      document.querySelectorAll("#buttons button")[n - 1].click();
    }
  });

  const init = async () => {
    try {
      const cfg = await (await fetch("/api/config")).json();
      $("title").textContent = cfg.title;
      document.title = cfg.title + " - den board";
      $("root").textContent = cfg.root;
      $("foot").textContent = "Reports land in " + cfg.reports_path +
        " - tell your agent to read that file.";
      buttons = Array.isArray(cfg.buttons) ? cfg.buttons : [];
      renderButtons();
    } catch {
      setOffline(true);
    }
    await loadReports();
    setInterval(loadReports, 5000);
  };
  init();
})();
</script>
</body>
</html>
