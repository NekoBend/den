<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>den board</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f6f3;
    --panel: #ffffff;
    --ink: #191918;
    --muted: #6e6d66;
    --line: #e3e2db;
    --accent: #35766e;
    --flash: #d9efe7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #161615;
      --panel: #1e1e1c;
      --ink: #e8e7e0;
      --muted: #a09f96;
      --line: #33322e;
      --accent: #5fb3a8;
      --flash: #23423a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", sans-serif;
  }
  main { max-width: 680px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  header { margin-bottom: 1rem; }
  h1 { font-size: 1.5rem; margin: 0; line-height: 1.3; }
  .sub { color: var(--muted); font-size: 0.8rem; word-break: break-all; }
  #offline {
    display: none;
    background: #d03b3b;
    color: #ffffff;
    border-radius: 6px;
    padding: 0.4rem 0.8rem;
    margin-bottom: 1rem;
    font-size: 0.85rem;
  }
  #reject {
    display: none;
    background: #b8860b;
    color: #ffffff;
    border-radius: 6px;
    padding: 0.4rem 0.8rem;
    margin-bottom: 1rem;
    font-size: 0.85rem;
  }
  h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
    padding-bottom: 0.4rem;
    margin: 0 0 0.4rem;
  }
  #tasks-section { display: none; margin-bottom: 1.25rem; }
  #tasks { list-style: none; margin: 0; padding: 0; }
  #tasks li {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 0.45rem 0.6rem;
    margin-bottom: 0.4rem;
  }
  #tasks li.settled { opacity: 0.6; border-left-color: var(--line); }
  #tasks .trow { display: flex; gap: 0.6rem; align-items: center; }
  #tasks .x { flex: 1; white-space: pre-wrap; word-break: break-word; }
  #tasks .state { color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
  #tasks button {
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.25rem 0.7rem;
    cursor: pointer;
  }
  #tasks button:hover { border-color: var(--accent); }
  #buttons {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 0.5rem;
    margin-bottom: 0.75rem;
  }
  #buttons button {
    font: inherit;
    font-weight: 600;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-top: 3px solid var(--accent);
    border-radius: 8px;
    padding: 0.7rem 0.5rem;
    cursor: pointer;
  }
  #buttons button:hover { border-color: var(--accent); }
  #buttons button.sent { background: var(--flash); }
  #buttons button .key { color: var(--muted); font-weight: 400; font-size: 0.75rem; }
  #note {
    width: 100%;
    min-height: 4.5rem;
    font: inherit;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.6rem 0.8rem;
    resize: vertical;
  }
  #note:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .hint { color: var(--muted); font-size: 0.78rem; margin: 0.3rem 0 1.5rem; }
  #reports { list-style: none; margin: 0; padding: 0; }
  #reports li {
    padding: 0.45rem 0.2rem 0.45rem 0.6rem;
    border-bottom: 1px solid var(--line);
    border-left: 3px solid var(--line);
    margin-bottom: 2px;
  }
  #reports .row { display: flex; gap: 0.6rem; align-items: baseline; }
  #reports .t { color: var(--muted); font-size: 0.78rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #reports .b { font-weight: 600; font-size: 0.85rem; white-space: nowrap; }
  #reports .x { white-space: pre-wrap; word-break: break-word; }
  .reply {
    margin: 0.3rem 0 0.1rem 1.5rem;
    padding: 0.25rem 0.6rem;
    border-left: 3px solid var(--accent);
    background: var(--panel);
    border-radius: 4px;
    font-size: 0.9rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .reply .who { color: var(--accent); font-weight: 600; font-size: 0.78rem; margin-right: 0.4rem; }
  #orphans-section { display: none; margin-top: 1.25rem; }
  #orphans { list-style: none; margin: 0; padding: 0; }
  #empty { color: var(--muted); font-size: 0.85rem; }
  footer { margin-top: 2rem; color: var(--muted); font-size: 0.78rem; word-break: break-all; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">den board</h1>
    <div class="sub" id="root"></div>
  </header>
  <div id="offline">Server not reachable. Restart it with: <code>den board</code></div>
  <div id="reject"></div>
  <section id="tasks-section" aria-label="tasks from the agent">
    <h2>Tasks from the agent</h2>
    <ul id="tasks"></ul>
  </section>
  <section id="buttons" aria-label="report buttons"></section>
  <textarea id="note" placeholder="Optional note - attached to the next button press"></textarea>
  <p class="hint">Keys 1-9 press a button (when the note box is not focused).
    Ctrl+Enter sends the note with the first button.</p>
  <h2>Reports</h2>
  <ul id="reports"></ul>
  <div id="empty">No reports yet.</div>
  <section id="orphans-section" aria-label="other agent notes">
    <h2>Agent notes</h2>
    <ul id="orphans"></ul>
  </section>
  <footer id="foot"></footer>
</main>
<script>
"use strict";
(() => {
  const $ = (id) => document.getElementById(id);
  let buttons = [];
  const REACTION_LABELS = { "task-done": "Done", "task-cant": "Can't" };

  const setOffline = (off) => { $("offline").style.display = off ? "block" : "none"; };

  const setReject = (msg) => {
    const el = $("reject");
    el.textContent = msg || "";
    el.style.display = msg ? "block" : "none";
  };

  const send = async (b, el, re) => {
    const text = $("note").value.trim();
    const body = { button: b.id, text };
    if (re) { body.re = re; }
    try {
      const r = await fetch("/api/report", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!r.ok) {
        // A 4xx is the server rejecting THIS report (too long, bad button),
        // not a dead server - keep the note text and say what was wrong.
        let msg = "Report rejected (HTTP " + r.status + ")";
        try {
          const j = await r.json();
          if (j.error) { msg = "Report rejected: " + j.error; }
        } catch { /* non-JSON error body */ }
        setReject(msg);
        setOffline(false);
        return;
      }
      setReject("");
      $("note").value = "";
      if (el) {
        el.classList.add("sent");
        setTimeout(() => el.classList.remove("sent"), 450);
      }
      setOffline(false);
      await tick();
    } catch {
      setOffline(true);
    }
  };

  const renderButtons = () => {
    const box = $("buttons");
    box.textContent = "";
    buttons.forEach((b, i) => {
      const el = document.createElement("button");
      el.type = "button";
      if (b.color) { el.style.borderTopColor = b.color; }
      el.append(document.createTextNode(b.label || b.id));
      if (i < 9) {
        el.append(" ");
        const k = document.createElement("span");
        k.className = "key";
        k.textContent = String(i + 1);
        el.append(k);
      }
      el.addEventListener("click", () => send(b, el, null));
      box.append(el);
    });
  };

  const fmtTime = (iso) => {
    const d = new Date(iso);
    return Number.isNaN(d.getTime()) ? iso : d.toLocaleTimeString();
  };

  const makeReply = (text) => {
    const div = document.createElement("div");
    div.className = "reply";
    const who = document.createElement("span");
    who.className = "who";
    who.textContent = "agent";
    div.append(who, document.createTextNode(text || ""));
    return div;
  };

  const renderTasks = (agent) => {
    // Settlement comes from the server (task.reaction, joined over the
    // full reports tail) - never re-derived from the page's 100-report
    // slice, which forgets old reactions and would reopen answered tasks.
    const all = agent.filter((e) => e.type === "task").slice().reverse();
    const replies = agent.filter((e) => e.type === "reply");
    const tasks = all.filter((t) => !t.reaction)
      .concat(all.filter((t) => t.reaction).slice(0, 8));
    $("tasks-section").style.display = tasks.length ? "block" : "none";
    const list = $("tasks");
    list.textContent = "";
    for (const task of tasks) {
      const li = document.createElement("li");
      const row = document.createElement("div");
      row.className = "trow";
      const x = document.createElement("span");
      x.className = "x";
      x.textContent = task.text || "";
      row.append(x);
      if (task.reaction) {
        li.classList.add("settled");
        const state = document.createElement("span");
        state.className = "state";
        state.textContent =
          (REACTION_LABELS[task.reaction.button] || task.reaction.button) +
          " " + fmtTime(task.reaction.ts);
        row.append(state);
      } else {
        for (const [id, label] of Object.entries(REACTION_LABELS)) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = label;
          btn.addEventListener("click", () => send({ id }, null, task.id));
          row.append(btn);
        }
      }
      li.append(row);
      for (const reply of replies.filter((e) => e.re === task.id)) {
        li.append(makeReply(reply.text));
      }
      list.append(li);
    }
  };

  const renderReports = (reports, agent) => {
    const list = $("reports");
    list.textContent = "";
    $("empty").style.display = reports.length ? "none" : "block";
    const byId = Object.fromEntries(buttons.map((b) => [b.id, b]));
    for (const rep of reports.slice().reverse()) {
      const li = document.createElement("li");
      const meta = byId[rep.button] || {};
      if (meta.color) { li.style.borderLeftColor = meta.color; }
      const row = document.createElement("div");
      row.className = "row";
      const t = document.createElement("span");
      t.className = "t";
      t.textContent = fmtTime(rep.ts);
      const b = document.createElement("span");
      b.className = "b";
      if (meta.color) { b.style.color = meta.color; }
      b.textContent = meta.label || REACTION_LABELS[rep.button] || rep.button;
      const x = document.createElement("span");
      x.className = "x";
      x.textContent = rep.text || "";
      row.append(t, b, x);
      li.append(row);
      for (const reply of agent.filter(
        (e) => e.type === "reply" && rep.id && e.re === rep.id,
      )) {
        li.append(makeReply(reply.text));
      }
      list.append(li);
    }
  };

  const renderOrphans = (agent, reports) => {
    // A reply whose target is a task, or a report outside the rendered
    // window, must still be VISIBLE - dropping it silently loses the
    // agent's answer.
    const taskIds = new Set(
      agent.filter((e) => e.type === "task").map((e) => e.id),
    );
    const reportIds = new Set(reports.map((r) => r.id).filter(Boolean));
    const orphans = agent.filter(
      (e) => e.type === "reply" && !taskIds.has(e.re) && !reportIds.has(e.re),
    );
    $("orphans-section").style.display = orphans.length ? "block" : "none";
    const list = $("orphans");
    list.textContent = "";
    for (const o of orphans.slice().reverse()) {
      const li = document.createElement("li");
      li.append(makeReply(o.text));
      list.append(li);
    }
  };

  let tickGen = 0;
  const tick = async () => {
    const my = ++tickGen;
    let reports;
    let agent;
    try {
      const [r1, r2] = await Promise.all([
        fetch("/api/reports?limit=100"),
        fetch("/api/agent"),
      ]);
      reports = (await r1.json()).reports || [];
      agent = (await r2.json()).entries || [];
      setOffline(false);
    } catch {
      if (my === tickGen) { setOffline(true); }
      return;
    }
    if (my !== tickGen) { return; }  // a newer snapshot is on its way
    renderTasks(agent);
    renderReports(reports, agent);
    renderOrphans(agent, reports);
  };

  document.addEventListener("keydown", (e) => {
    if (e.target === $("note")) {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && buttons.length) {
        e.preventDefault();
        send(buttons.find((b) => b.id === "note") || buttons[0], null, null);
      }
      return;
    }
    // Modifier chords (Ctrl/Cmd+1 = browser tab switch) and held-key
    // auto-repeat must not file reports.
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) { return; }
    const n = Number.parseInt(e.key, 10);
    if (n >= 1 && n <= Math.min(buttons.length, 9)) {
      document.querySelectorAll("#buttons button")[n - 1].click();
    }
  });

  const init = async () => {
    try {
      const cfg = await (await fetch("/api/config")).json();
      $("title").textContent = cfg.title;
      document.title = cfg.title + " - den board";
      $("root").textContent = cfg.root;
      $("foot").textContent = "Reports land in " + cfg.reports_path +
        " - tell your agent to read that file.";
      buttons = Array.isArray(cfg.buttons) ? cfg.buttons : [];
      renderButtons();
    } catch {
      setOffline(true);
    }
    await tick();
    setInterval(tick, 5000);
  };
  init();
})();
</script>
</body>
</html>
